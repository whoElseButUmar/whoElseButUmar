    OMAR ADERKAOUI
  </text>

  <text
    x="68"
    y="278"
    fill="#A8A397"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600"
    letter-spacing="2.4"
  >
    SOFTWARE ENGINEER / PRODUCT BUILDER
  </text>

  <!-- Right control -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text
      x="975"
      y="154"
      text-anchor="middle"
      fill="#6E6B63"
      font-size="12"
      font-weight="700"
      letter-spacing="2.2"
