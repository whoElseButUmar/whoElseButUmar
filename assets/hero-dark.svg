    <circle cx="70" cy="351" r="5" fill="#E4572E" />

    <text x="86" y="355" fill="#A8A397">
      PRODUCT ENGINEERING
    </text>

    <circle cx="292" cy="351" r="5" fill="#7A9A63" />

    <text x="308" y="355" fill="#A8A397">
      PLATFORM SYSTEMS
    </text>

    <circle cx="500" cy="351" r="5" fill="#E3B341" />

    <text x="516" y="355" fill="#A8A397">
      APPLIED AI
    </text>

    <text
      x="1130"
      y="355"
      text-anchor="end"
      fill="#A8A397"
