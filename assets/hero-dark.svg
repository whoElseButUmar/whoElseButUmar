<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="400"
  viewBox="0 0 1200 400"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Umar — Omar Aderkaoui</title>
  <desc id="desc">
    Profile banner for Omar Aderkaoui, software engineer and product builder.
  </desc>

  <rect width="1200" height="400" rx="18" fill="#171715" />

  <!-- Structure -->
  <g opacity="0.72" stroke="#2C2C28" stroke-width="1">
    <line x1="48" y1="86" x2="1152" y2="86" />
    <line x1="48" y1="326" x2="1152" y2="326" />
    <line x1="820" y1="36" x2="820" y2="364" />
    <line x1="48" y1="36" x2="48" y2="364" />
    <line x1="1152" y1="36" x2="1152" y2="364" />
  </g>

  <!-- Top indicator -->
  <g>
    <circle cx="74" cy="61" r="9" fill="#E4572E" />
    <circle cx="108" cy="61" r="9" fill="#7A9A63" />
    <circle cx="142" cy="61" r="9" fill="#E3B341" />

    <circle
      cx="176"
      cy="61"
      r="9"
      fill="none"
      stroke="#A8A397"
      stroke-width="2"
    />
  </g>

  <!-- Identity -->
  <text
    x="62"
    y="205"
    fill="#F3F0E8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="118"
    font-weight="800"
    letter-spacing="-5"
  >
    UMAR
  </text>

  <rect
    x="68"
    y="226"
    width="92"
    height="7"
    rx="3.5"
    fill="#E4572E"
